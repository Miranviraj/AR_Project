name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Build iOS App (Bypass Signing Error)
        run: |
          # Flutter will compile the app and fail at the very last second 
          # because the cloud runner lacks Apple Developer credentials.
          # "|| true" forces GitHub Actions to continue anyway.
          flutter build ios --release --no-codesign || true
          
          # Safety check: Verify the app actually compiled successfully.
          # If this folder is missing, you have a real syntax/code error.
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "❌ Runner.app was not generated. Real compilation error occurred."
            exit 1
          fi
          echo "✅ Runner.app successfully generated!"

      - name: Package into unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload
          zip -r app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app.ipa