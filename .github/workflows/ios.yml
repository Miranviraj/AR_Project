name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Switch Xcode to Manual Provisioning
        run: |
          # This prevents Xcode from crashing while looking for a Developer Account,
          # but DOES NOT break the framework embedding phase (fixes the 14kb bug).
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS App
        run: |
          # We still use || true just in case xcodebuild throws a non-fatal warning exit code at the very end
          flutter build ios --release --no-codesign || true

      - name: Package into unsigned IPA
        run: |
          mkdir -p Payload
          
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app was not found. Compilation failed."
            exit 1
          fi
          
          echo "✅ Found Runner.app! Packaging full payload..."
          cp -r "$APP_PATH" Payload/
          zip -q -r app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app.ipa