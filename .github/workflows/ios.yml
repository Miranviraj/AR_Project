name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Force Disable Apple Code Signing
        run: |
          # Inject build settings directly into Flutter's iOS config.
          # This forces Xcode to skip the signing phase entirely.
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY = \"\"" >> ios/Flutter/Release.xcconfig

      - name: Build iOS App
        run: |
          # We keep the "|| true" safety net just in case Xcode 
          # still throws a non-fatal warning exit code.
          flutter build ios --release --no-codesign || true

      - name: Package into unsigned IPA
        run: |
          mkdir -p Payload
          
          # Dynamically search the build folder for the compiled Runner.app 
          # instead of hardcoding a path that Flutter might abandon.
          APP_PATH=$(find build/ios -type d -name "Runner.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Runner.app was not found anywhere. Real compilation error occurred."
            exit 1
          fi
          
          echo "✅ Found Runner.app at $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -q -r app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app.ipa