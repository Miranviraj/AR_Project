name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Build iOS Archive (Unsigned)
        run: |
          # Flutter successfully builds the archive, but throws exit 1 at the end 
          # during signature validation. "|| true" forces the workflow to continue.
          flutter build ipa --release --no-codesign || true

      - name: Package into unsigned IPA
        run: |
          mkdir -p Payload
          
          # The fully assembled 15MB+ app lives inside the generated archive directory
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app was not found in the archive. Compilation failed."
            exit 1
          fi
          
          echo "✅ Found fully assembled Runner.app!"
          cp -r "$APP_PATH" Payload/
          zip -q -r app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app.ipa