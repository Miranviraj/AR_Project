name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Build iOS Archive (Unsigned)
        run: |
          # By using "ipa" instead of "ios", Flutter creates a full .xcarchive.
          # This forces Xcode to embed all 15MB+ of your frameworks and assets,
          # and the --no-codesign flag tells it to safely stop before signing!
          flutter build ipa --release --no-codesign

      - name: Package into unsigned IPA
        run: |
          mkdir -p Payload
          
          # The fully assembled app lives inside the generated archive directory
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app was not found in the archive. Compilation failed."
            exit 1
          fi
          
          echo "✅ Found fully assembled Runner.app!"
          cp -r "$APP_PATH" Payload/
          zip -q -r app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app.ipa