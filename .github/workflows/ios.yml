name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Force Manual Provisioning
        run: |
          # Prevents Xcode from crashing early while looking for Dev Accounts
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS App (Unsigned)
        run: |
          # We use "ios" instead of "ipa" because it's faster and doesn't run the strict export phase.
          # || true forces GitHub Actions to ignore the final code-signing crash.
          flutter build ios --release --no-codesign || true

      - name: Hunt and Package IPA
        run: |
          mkdir -p Payload
          
          echo "Hunting for Runner.app with embedded frameworks..."
          APP_PATH=""
          
          # Dynamically find ALL Runner.app folders in the build directory
          while IFS= read -r path; do
            # Check if it has the heavy Flutter Frameworks inside (proves it's the 15MB+ app)
            if [ -d "$path/Frameworks" ]; then
              APP_PATH="$path"
              break
            fi
          done < <(find build/ios -type d -name "Runner.app")

          if [ -z "$APP_PATH" ]; then
             echo "❌ No fully assembled Runner.app found. Listing what was actually generated:"
             find build/ios -type d -name "Runner.app" -exec du -sh {} \;
             exit 1
          fi

          echo "✅ Found full Runner.app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -q -r app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app.ipa