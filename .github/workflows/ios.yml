name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Build iOS App (Ignore Errors)
        run: |
          flutter build ios --release --no-codesign || true

      - name: Find and Package the REAL App
        run: |
          mkdir -p Upload_Folder
          
          find build -type d -name "Runner.app" | while read app_path; do
            size_mb=$(du -sm "$app_path" | awk '{print $1}')
          
            if [ "$size_mb" -gt 5 ]; then
              echo "✅ Found the real app: $app_path ($size_mb MB)"
              cp -R "$app_path" Upload_Folder/
            fi
          done

      - name: Upload the Heavy App to Windows PC
        uses: actions/upload-artifact@v4
        with:
          name: Ancient-Ceylon-Final-App
          path: Upload_Folder/