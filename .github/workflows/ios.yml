name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Build iOS App (Direct)
        run: |
          # build ios directly outputs to the iphoneos folder
          flutter build ios --release --no-codesign || true

      - name: Upload App Folder
        uses: actions/upload-artifact@v4
        with:
          name: Runner-App-Folder
          # This grabs the entire folder containing your app
          path: build/ios/iphoneos/