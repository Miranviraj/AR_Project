name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Build iOS App (Ignore Errors)
        run: |
          # මේකෙන් app එක build කරනවා. || true තියෙන නිසා error ආවත් build එක නවතින්නේ නැහැ
          flutter build ios --release --no-codesign || true

      - name: Vacuum and Find Runner.app
        run: |
          mkdir -p Upload_Folder
          # සම්පූර්ණ මැෂින් එකේම search කරලා Runner.app එක හොයාගෙන Upload_Folder එකට දානවා
          find . -type d -name "Runner.app" -exec cp -R {} Upload_Folder/ \;

      - name: Upload to Windows PC
        uses: actions/upload-artifact@v4
        with:
          name: Ancient-Ceylon-App-Files
          path: Upload_Folder/