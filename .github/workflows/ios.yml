name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Build iOS Archive (Unsigned)
        run: |
          # මේකෙන් සම්පූර්ණ 15MB+ ඇප් එක build වෙනවා.
          # || true දාලා තියෙන නිසා අන්තිම මොහොතේ එන signing error එක මඟහරිනවා.
          flutter build ipa --release --no-codesign || true

      - name: Upload Full Archive
        uses: actions/upload-artifact@v4
        with:
          name: full-ios-archive
          # කෙලින්ම archive ෆෝල්ඩර් එකම අප්ලෝඩ් කරනවා
          path: build/ios/archive/Runner.xcarchive/Products/Applications/