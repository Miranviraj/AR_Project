name: ar
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: 12.0.1
  ar_flutter_plugin_plus: ^1.1.3
  vector_math: ^2.2.0
  camera: ^0.10.5
  model_viewer_plus: ^1.7.0
  google_generative_ai: ^0.4.7
  flutter_tts: ^3.8.3
  shared_preferences: ^2.2.2
  geolocator: 14.0.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  image_picker: ^0.8.9
  google_maps_flutter: ^2.5.3
  path_provider: ^2.1.4
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^5.0.0

# Configuration block for launcher icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/labels.txt
    - assets/banner.jpg
    - assets/banner2.jpg
    - assets/banner3.jpg
    - assets/splash_bg.jpg
    - assets/models/medirigiriya.glb
    - assets/models/polonnaruwa_watadageya.glb
    - assets/models/royal_palace.glb
    - assets/models/royal_palace.usdz
    - assets/guide_portrait.png